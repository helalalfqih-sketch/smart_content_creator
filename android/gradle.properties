org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false

# Fix: Kotlin compile daemon connection issues (Windows)
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1

# Performance: Enable Gradle daemon and caching
org.gradle.daemon=true
org.gradle.caching=true

# Android flags (added automatically by Flutter migrator)
android.builtInKotlin=false
android.newDsl=false
