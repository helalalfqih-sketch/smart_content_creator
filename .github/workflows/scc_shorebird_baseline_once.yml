name: Validate SCC Shorebird baseline

on:
  push:
    branches: [codex/shorebird-baseline-20261031]
    paths:
      - .github/workflows/scc_shorebird_baseline_once.yml

permissions:
  contents: read

concurrency:
  group: scc-shorebird-baseline-1.3.1-rc.2-8
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      RELEASE_VERSION: 1.3.1-rc.2+8
      EXPECTED_CERT_SHA256: 421cd80d80141ef72cc26235e415277e1af862ffe369234f7d04538f74ba2636
    steps:
      - name: Check out the exact baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and prepare the recovered Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/ci/android_candidate.py prepare

      - name: Lock the recovered signing certificate before any build
        shell: bash
        run: |
          set -euo pipefail
          actual="$(tr -d ':[:space:]' < "$RUNNER_TEMP/scc-android-signing/certificate-sha256.txt" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          echo "Recovered Android signing certificate matches the locked certificate."

      - name: Download the pinned Android bundle inspector
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict

      - name: Verify continuity with the original Shorebird bundle
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: python3 scripts/ci/android_candidate.py compare-shorebird

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@8b1059ddb56a926f0146edf4133cc647775c162f # v1
        with:
          cache: "false"

      - name: Confirm the candidate release number is unused
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shorebird releases list \
            --app-id 50f79796-407c-4909-a7c2-8ed8d05d25b3 \
            --platform android \
            --json > "$RUNNER_TEMP/releases.json"
          if grep -Fq '1.3.1-rc.2+8' "$RUNNER_TEMP/releases.json"; then
            echo "Release $RELEASE_VERSION already exists; refusing to continue." >&2
            exit 1
          fi
          echo "Release $RELEASE_VERSION is unused."

      - name: Build and validate without publishing
        uses: shorebirdtech/shorebird-release@8605c991e8f513451c775ae3909984e9476748a2 # v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          flutter-version: 3.44.6
          platform: android
          args: >-
            --dry-run
            --artifact apk
            --target lib/main.dart
            --build-name 1.3.1-rc.2
            --build-number 8

      - name: Verify dry-run package identity, signer and checksums
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs -type f -name 'app-release.apk' -print -quit)"
          aab="$(find build/app/outputs -type f -name 'app-release.aab' -print -quit)"
          test -n "$apk" && test -f "$apk"
          test -n "$aab" && test -f "$aab"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          cert="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':[:space:]')"
          test "$cert" = "$EXPECTED_CERT_SHA256"

          badging="$("$build_tools/aapt" dump badging "$apk" | head -n 1)"
          grep -F "package: name='com.smartcontentcreator.app'" <<<"$badging"
          grep -F "versionCode='8'" <<<"$badging"
          grep -F "versionName='1.3.1-rc.2'" <<<"$badging"

          jarsigner -verify "$aab"
          aab_cert="$(keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$aab" | awk -F': ' '/SHA256:/ {print tolower($2); exit}' | tr -d ':[:space:]')"
          test "$aab_cert" = "$EXPECTED_CERT_SHA256"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab"
          git diff --exit-code -- pubspec.lock

          mkdir -p build/shorebird-validation-report
          sha256sum "$apk" "$aab" | tee build/shorebird-validation-report/SHA256SUMS.txt
          printf '%s\n' \
            "release_version=$RELEASE_VERSION" \
            "source_commit=$GITHUB_SHA" \
            "certificate_sha256=$cert" \
            "publication=dry-run-only" \
            > build/shorebird-validation-report/validation.txt
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

      - name: Retain the validated dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scc-shorebird-dry-run-1.3.1-rc.2-build-8
          path: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            build/shorebird-validation-report/
            build/candidate-report/shorebird-signing-comparison.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: python3 scripts/ci/android_candidate.py cleanup

