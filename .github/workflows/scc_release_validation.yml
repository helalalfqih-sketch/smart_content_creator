name: SCC release validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [codex/shorebird-recovery-20261030, codex/shopify-vps-catalog-ota-20261031, codex/openrouter-vision-fix-20261101, codex/openrouter-image-generation-fix-20261101, codex/vision-transport-fix-20261102]

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/security
      - name: Test authorization using a local demo database
        run: npm test
        working-directory: tests/security

  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      # Never enable the optional live Back4App integration test in this job.
      PARSE_APPLICATION_ID: ''
      PARSE_REST_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - id: dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run offline Flutter tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub
