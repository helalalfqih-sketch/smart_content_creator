name: SCC signed Android candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/shorebird-recovery-20261030]
    paths:
      - .github/workflows/scc_android_candidate.yml
      - scripts/ci/android_candidate.py

permissions:
  contents: read

concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise signing failure and cleanup boundaries with temporary test keys
        run: python3 -m unittest discover -s scripts/ci -p 'test_android_candidate.py' -v
      - name: Verify signing credentials without printing their values
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/ci/android_candidate.py prepare
      - name: Download public reference APK and bundle inspector
        run: |
          curl --fail --location --retry 2 --max-time 300 'https://github.com/helalalfqih-sketch/smart_content_creator/releases/download/v1.3.0/app-arm64-v8a-release.apk' --output "$RUNNER_TEMP/scc-v1.3.0-arm64.apk"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/bundletool.jar"
          python3 - <<'PY'
          import hashlib, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'bundletool.jar'), 'rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          assert actual == 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29', 'bundletool checksum mismatch'
          PY
      - name: Compare signing certificate with published v1.3.0 APK
        run: python3 scripts/ci/android_candidate.py compare-baseline
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Build signed APK and AAB for review
        run: |
          flutter build apk --release --no-pub --target lib/main.dart --build-name 1.3.1-rc.1 --build-number 7
          flutter build appbundle --release --no-pub --target lib/main.dart --build-name 1.3.1-rc.1 --build-number 7
      - name: Verify identity, signature and artifact checksums
        run: python3 scripts/ci/android_candidate.py verify
      - name: Remove signing material
        if: always()
        run: python3 scripts/ci/android_candidate.py cleanup
      - name: Retain signed QA artifacts, not a public release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scc-android-candidate-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/candidate-report/
          if-no-files-found: error
          retention-days: 7
      - name: Retain non-secret diagnostic report if checks fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scc-signing-review-${{ github.sha }}
          path: build/candidate-report/
          if-no-files-found: ignore
          retention-days: 7
