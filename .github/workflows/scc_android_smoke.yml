name: SCC Android candidate smoke

on:
  workflow_dispatch:
  push:
    branches: [codex/shorebird-recovery-20261030]
    paths:
      - .github/workflows/scc_android_smoke.yml
      - scripts/qa/android_smoke.py

permissions:
  contents: read
  actions: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: 2f0f24a728aaea4955fff24867700d5ccee1d905
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scc-android-candidate-2f0f24a728aaea4955fff24867700d5ccee1d905
          path: candidate
          github-token: ${{ github.token }}
          run-id: 41110483983
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and restart the signed candidate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/qa/android_smoke.py
      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scc-android-smoke-${{ env.CANDIDATE_SHA }}
          path: build/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
