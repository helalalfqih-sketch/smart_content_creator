name: 🚀 Build Android Release (App Bundle)

on:
  push:
    branches:
      - main
  workflow_dispatch: # يسمح بتشغيل يدوي من GitHub UI

jobs:
  build-android:
    name: Build AAB on Linux
    runs-on: ubuntu-latest # ← Linux = لا مشاكل مع strip أبداً!

    steps:
      # 1. تحميل الكود
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد Flutter (نفس إصدارك المحلي)
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true # تسريع البناء بالـ Cache

      # 4. تحميل الـ Android NDK المطلوب
      - name: 📦 Set up Android NDK 28
        run: |
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> $GITHUB_ENV
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      # 5. تحميل التبعيات
      - name: 📦 Get Flutter Dependencies
        run: flutter pub get

      # 6. بناء الـ App Bundle والـ APKs
      - name: 🏗️ Build Release APKs & App Bundle
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Duser.language=en -Duser.country=US"

      # 7. إعادة تسمية ملفات الـ APK لتسهيل تنزيلها بأسماء واضحة
      - name: 🏷️ Rename APK Assets
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/smart-content-creator-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/smart-content-creator-arm32.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/smart-content-creator-x86.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/smart-content-creator.aab

      # 8. إنشاء/تحديث الإصدار (Release) على GitHub ورفع الملفات
      - name: 🚀 Publish Latest Release to GitHub
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/release/*.aab"
          tag: "v1.2.1" # يمكنك تغيير هذا التاج عند تحديث إصدار التطبيق
          name: "Smart Content Creator v1.2.1"
          body: "التحديث الأخير لتطبيق صانع المحتوى الذكي. يشمل تحسينات الأداء وتكامل Meta APIs."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # 9. رفع الـ Artifacts كنسخة احتياطية للـ Action run
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 7

