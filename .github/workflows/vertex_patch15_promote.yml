name: Promote verified Vertex Patch 15
on:
  push:
    branches: [migration/patch14-vertex-direct]
    paths:
      - '.github/workflows/vertex_patch15_promote.yml'
permissions:
  contents: read
concurrency:
  group: vertex-patch15-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/migration/patch14-vertex-direct' && github.run_attempt == 1 && github.event.head_commit.message == 'Promote verified Patch 15 to stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      RELEASE_VERSION: '1.3.1-rc.2+8'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify application source matches the staged patch
        run: |
          set -euo pipefail
          git diff --exit-code 78b72e59f7bfc61102108c665eb15ec8c77c5a9f HEAD -- . ':(exclude).github/workflows/vertex_patch15_promote.yml'
          grep -Fx 'app_id: 50f79796-407c-4909-a7c2-8ed8d05d25b3' shorebird.yaml
      - uses: shorebirdtech/setup-shorebird@8b1059ddb56a926f0146edf4133cc647775c162f
      - name: Promote the existing Patch 15, never rebuild or publish a new patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SHOREBIRD_TOKEN:?Missing Shorebird token}"
          shorebird patches list --release-version "$RELEASE_VERSION" | tee "$RUNNER_TEMP/patches-before.txt"
          grep -E '838448[[:space:]]+#15[[:space:]]+track:[[:space:]]+staging' "$RUNNER_TEMP/patches-before.txt"
          if grep -E '#(1[6-9]|[2-9][0-9]|[0-9]{3,})[[:space:]]+track:[[:space:]]+stable' "$RUNNER_TEMP/patches-before.txt"; then
            echo 'Newer stable patch exists; refusing to promote'
            exit 1
          fi
          shorebird patches promote --release-version "$RELEASE_VERSION" --patch-number 15
          shorebird patches list --release-version "$RELEASE_VERSION" | tee "$RUNNER_TEMP/patches-after.txt"
          grep -E '838448[[:space:]]+#15[[:space:]]+track:[[:space:]]+stable' "$RUNNER_TEMP/patches-after.txt"
