name: Patch 14 direct Vertex validation
on:
  push:
    branches: [migration/patch14-vertex-direct]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex-patch14-validation
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PARSE_APPLICATION_ID: ''
      PARSE_REST_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub test/direct_vertex_patch14_test.dart test/chat_provider_selection_test.dart test/ai_backend_router_test.dart test/firebase_prompt_wave1a_test.dart test/manus_ai_provider_test.dart
      - run: git diff --exit-code -- pubspec.lock

  shorebird-dry-run:
    needs: offline
    if: github.ref == 'refs/heads/migration/patch14-vertex-direct'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      RELEASE_VERSION: '1.3.1-rc.2+8'
      BASELINE_APK_SHA256: 8dfa9616b50fd4b7ee33a3d040344258f95a7c765583a2f9f579251d89843686
      PATCH14_SOURCE: fe503c8cfc8e9fdd146bc8d33ed19fd0ac0f24a6
      EXPECTED_CERT_SHA256: 421cd80d80141ef72cc26235e415277e1af862ffe369234f7d04538f74ba2636
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Dart-only changes against the published Patch 14 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PATCH14_SOURCE" HEAD
          unexpected="$(git diff --name-only "$PATCH14_SOURCE" HEAD | grep -Ev '^(lib/services/(ai_backend_router|direct_vertex_service)\.dart|lib/widgets/chat/chat_input_area\.dart|test/(direct_vertex_patch14|chat_provider_selection|ai_backend_router|firebase_prompt_wave1a|manus_ai_provider)_test\.dart|\.github/workflows/vertex_patch14_validation\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --exit-code "$PATCH14_SOURCE" HEAD -- android pubspec.yaml pubspec.lock shorebird.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: shorebirdtech/setup-shorebird@8b1059ddb56a926f0146edf4133cc647775c162f
      - name: Configure and verify Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing keystore}" "${KEYSTORE_PASSWORD:?Missing store password}" "${KEY_ALIAS:?Missing alias}" "${KEY_PASSWORD:?Missing key password}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          fingerprint="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          test "$fingerprint" = "$EXPECTED_CERT_SHA256"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t').replace(' ', '\\ ').replace('=', '\\=').replace(':', '\\:').replace('#', '\\#').replace('!', '\\!')
          values = {
              'storeFile': os.path.join(os.environ['RUNNER_TEMP'], 'release.jks'),
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          Path('android/key.properties').write_text(''.join(f'{k}={escape(v)}\n' for k,v in values.items()), encoding='utf-8')
          PY
      - name: Prepare verified installed APK asset audit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 300 \
            'https://github.com/helalalfqih-sketch/smart_content_creator/releases/download/v1.3.1-rc.2/app-release.apk' \
            --output "$RUNNER_TEMP/installed-baseline.apk"
          echo "$BASELINE_APK_SHA256  $RUNNER_TEMP/installed-baseline.apk" | sha256sum --check --strict
          python3 -m venv "$RUNNER_TEMP/asset-audit-venv"
          echo 'fonttools==4.59.2 --hash=sha256:8bd0f759020e87bb5d323e6283914d9bf4ae35a7307dafb2cbd1e379e720ad37' > "$RUNNER_TEMP/font-audit-requirements.txt"
          "$RUNNER_TEMP/asset-audit-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/font-audit-requirements.txt"
      - name: Check existing Shorebird release and build without publishing
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SHOREBIRD_TOKEN:?Missing Shorebird token}"
          shorebird releases info --release-version "$RELEASE_VERSION"
          shorebird patch android --release-version "$RELEASE_VERSION" --track=staging --target lib/main.dart --dry-run --allow-asset-diffs
          git diff --exit-code -- pubspec.lock
      - name: Verify every required asset and icon against installed APK
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asset-audit-venv/bin/python" - \
            "$RUNNER_TEMP/installed-baseline.apk" \
            build/app/outputs/bundle/release/app-release.aab \
            "$BASELINE_APK_SHA256" \
            "$RUNNER_TEMP/vertex-asset-compatibility.json" <<'PY'
          """Permit only removal of unused Material icon glyphs in this OTA patch."""
          import hashlib
          import io
          import json
          import sys
          import zipfile
          from pathlib import Path
          
          from fontTools.pens.recordingPen import DecomposingRecordingPen
          from fontTools.ttLib import TTFont
          
          
          def verify_assets(baseline_path, candidate_path, expected_sha):
              baseline_bytes = Path(baseline_path).read_bytes()
              if hashlib.sha256(baseline_bytes).hexdigest() != expected_sha:
                  raise ValueError("Baseline APK checksum mismatch")
          
              def assets(archive, prefix):
                  with zipfile.ZipFile(archive) as package:
                      return {
                          name[len(prefix):]: package.read(name)
                          for name in package.namelist()
                          if name.startswith(prefix) and not name.endswith("/")
                      }
          
              baseline = assets(io.BytesIO(baseline_bytes), "assets/")
              candidate = assets(candidate_path, "base/assets/")
              # bundletool adds these ART optimization profiles when producing an APK.
              # In an AAB the same metadata lives outside base/assets, not in app assets.
              packaging_profiles = {"dexopt/baseline.prof", "dexopt/baseline.profm"}
              ignored_profiles = sorted(packaging_profiles & baseline.keys())
              baseline = {name: data for name, data in baseline.items() if name not in packaging_profiles}
              if not baseline or baseline.keys() != candidate.keys():
                  raise ValueError(
                      f"Packaged assets differ: added={sorted(candidate.keys() - baseline.keys())}; "
                      f"removed={sorted(baseline.keys() - candidate.keys())}"
                  )
              changed = {name for name in baseline if baseline[name] != candidate[name]}
              icon = "flutter_assets/fonts/MaterialIcons-Regular.otf"
              if not changed.issubset({icon}) or icon not in baseline:
                  raise ValueError(f"Unexpected changed assets: {sorted(changed)}")
          
              old_font = TTFont(io.BytesIO(baseline[icon]))
              new_font = TTFont(io.BytesIO(candidate[icon]))
              old_map = old_font.getBestCmap()
              new_map = new_font.getBestCmap()
              if not old_map or not new_map or not new_map.keys() <= old_map.keys():
                  raise ValueError("Patch requires absent icon codepoints: " + ", ".join(f"U+{cp:04X}" for cp in sorted(new_map.keys() - old_map.keys())))
              if old_font["head"].unitsPerEm != new_font["head"].unitsPerEm:
                  raise ValueError("Icon font scale changed")
              old_glyphs = old_font.getGlyphSet()
              new_glyphs = new_font.getGlyphSet()
              for codepoint, new_name in new_map.items():
                  old_name = old_map[codepoint]
                  old_pen = DecomposingRecordingPen(old_glyphs)
                  new_pen = DecomposingRecordingPen(new_glyphs)
                  old_glyphs[old_name].draw(old_pen)
                  new_glyphs[new_name].draw(new_pen)
                  if old_pen.value != new_pen.value:
                      raise ValueError(f"Icon outline changed: U+{codepoint:04X}")
                  if old_font["hmtx"][old_name] != new_font["hmtx"][new_name]:
                      raise ValueError(f"Icon metrics changed: U+{codepoint:04X}")
              return {
                  "status": "compatible",
                  "baseline_sha256": expected_sha,
                  "asset_count": len(baseline),
                  "changed_assets": sorted(changed),
                  "apk_packaging_profiles": ignored_profiles,
                  "baseline_icon_count": len(old_map),
                  "candidate_icon_count": len(new_map),
                  "removed_unused_icon_count": len(old_map.keys() - new_map.keys()),
              }
          
          
          if __name__ == "__main__":
              report = verify_assets(*sys.argv[1:4])
              Path(sys.argv[4]).write_text(json.dumps(report, indent=2) + "\n")
              print(json.dumps(report))
          PY
      - name: Publish verified patch to staging only
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/patch14-vertex-direct' && github.run_attempt == 1 && github.event.head_commit.message == 'Publish validated Vertex patch to staging only'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Require the exact previously validated application source.
          git diff --exit-code 29fb20a4a0b64f526459a63c1e17b97129b5c8cc HEAD -- . ':(exclude).github/workflows/vertex_patch14_validation.yml'
          git diff --exit-code -- pubspec.lock
          test -s "$RUNNER_TEMP/vertex-asset-compatibility.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "compatible"' "$RUNNER_TEMP/vertex-asset-compatibility.json"
          shorebird patch android --release-version "$RELEASE_VERSION" --track=staging --target lib/main.dart --allow-asset-diffs
          shorebird patches list --release-version "$RELEASE_VERSION"
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
