name: Publish SCC OpenRouter Google Vertex patch once

on:
  push:
    branches: [codex/openrouter-claude-opus-5-5-google-vertex-20261031]
    paths:
      - .github/workflows/scc_shorebird_openrouter_patch_once.yml

permissions:
  contents: read

concurrency:
  group: scc-shorebird-openrouter-google-vertex-1.3.1-rc.2-8
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      RELEASE_VERSION: 1.3.1-rc.2+8
      APP_SOURCE_COMMIT: 078bb44065bbab52623cf5dd2e15991ae34cc7d8
      EXPECTED_CERT_SHA256: 421cd80d80141ef72cc26235e415277e1af862ffe369234f7d04538f74ba2636
    steps:
      - name: Check out the exact patch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lock the validated Dart-only application source
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git diff --name-only 3bb6bd94b0315772c8d9b52162fa5bedca40ad49 "$GITHUB_SHA" -- . |
              grep -Ev '^(lib/controllers/settings_controller\.dart|lib/core/models/api_provider\.dart|lib/screens/settings_screen\.dart|lib/services/ai/intent_classifier_service\.dart|lib/services/ai_backend_router\.dart|lib/services/ai_provider\.dart|lib/services/openai_service\.dart|lib/widgets/chat/chat_input_area\.dart|lib/widgets/provider_selection_list\.dart|test/ai_backend_router_test\.dart|test/firebase_prompt_wave1a_test\.dart|test/manus_ai_provider_test\.dart|\.github/workflows/scc_shorebird_openrouter_patch_once\.yml)$' || true
          )"
          test -z "$unexpected"
          changed="$(git diff --name-only "$APP_SOURCE_COMMIT" "$GITHUB_SHA" -- . ':(exclude).github/workflows/scc_shorebird_openrouter_patch_once.yml')"
          test -z "$changed"

          grep -F "defaultModel: 'anthropic/claude-opus-5.5'" lib/services/ai_provider.dart
          grep -F "providerOnly: const ['google-vertex']" lib/services/ai_provider.dart
          grep -F "allowProviderFallbacks: false" lib/services/ai_provider.dart
          grep -F "backendOverride: 'firebase_ai'" lib/services/ai/intent_classifier_service.dart

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/ci/android_candidate.py prepare

      - name: Lock the signing certificate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(tr -d ':[:space:]' < "$RUNNER_TEMP/scc-android-signing/certificate-sha256.txt" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@8b1059ddb56a926f0146edf4133cc647775c162f # v1
        with:
          cache: "false"

      - name: Confirm the target baseline exists
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird releases info --release-version "$RELEASE_VERSION"

      - name: Publish the validated Dart patch
        id: shorebird-patch
        uses: shorebirdtech/shorebird-patch@06df73215dc3fafdef1d949fe4866a6822d145f9 # v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          release-version: ${{ env.RELEASE_VERSION }}
          track: stable
          args: >-
            --target lib/main.dart

      - name: Confirm the published patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          patch_number="${{ steps.shorebird-patch.outputs.patch-number }}"
          test -n "$patch_number"
          shorebird patches list --release-version "$RELEASE_VERSION"
          echo "Published stable Shorebird patch $patch_number for $RELEASE_VERSION."

      - name: Confirm the lockfile stayed unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Remove signing material
        if: always()
        run: python3 scripts/ci/android_candidate.py cleanup
