name: SCC OTA prerequisites
on:
  workflow_dispatch:
  push:
    branches: [codex/shorebird-recovery-20261030]
    paths:
      - .github/workflows/scc_ota_prerequisites.yml
permissions:
  contents: read
jobs:
  shorebird-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify token access to the configured app without publishing
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SHOREBIRD_TOKEN", "").strip()
          if not token:
              raise SystemExit("SHOREBIRD_TOKEN is missing.")
          app_id = "50f79796-407c-4909-a7c2-8ed8d05d25b3"
          request = urllib.request.Request(
              f"https://api.shorebird.dev/api/v1/apps/{app_id}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              method="GET",
          )
          # Never forward credentials to a redirect destination.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  app = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Shorebird access check failed: HTTP {error.code}.") from None
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("Shorebird access check failed: network or response error.") from None
          if app.get("app_id") != app_id or app.get("organization_id") != 52539:
              raise SystemExit("Shorebird returned an unexpected app or organization.")
          message = "Authenticated read of the configured Shorebird app succeeded. Release/patch write permissions and signing are not tested. No release or patch was sent."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
          PY
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check existing credentials without revealing their values
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os
          names = ("SHOREBIRD_TOKEN", "KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_PASSWORD", "KEY_ALIAS")
          missing = [name for name in names if not os.environ.get(name)]
          lines = ["# OTA build prerequisites", "", "Presence only: no credential values are printed or uploaded.", ""]
          lines += [f"- {name}: {'missing' if name in missing else 'present'}" for name in names]
          lines += ["", "Presence does not prove validity, signing identity, or access to the Shorebird app.",
                    "This workflow does not build, publish, or patch an application."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          for name in names:
              print(f"{name}: {'MISSING' if name in missing else 'PRESENT'}")
          if missing:
              raise SystemExit("Build blocked: required credentials are absent.")
          PY
